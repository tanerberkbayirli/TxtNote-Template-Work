<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TxtNote</title>
    <link rel="icon" type="image/png" href="/brand/txt.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <script>
      try {
        var theme = JSON.parse(localStorage.getItem("txtnote.theme"));
        if (theme && theme !== "light") document.documentElement.classList.add("dark");
        if (theme === "black") document.documentElement.classList.add("theme-black");
      } catch (error) {}
    </script>
    <style id="txtnote-trusted-style">
      html, body, #root { height: 100%; margin: 0; }
      *, *::before, *::after { -webkit-user-select: none; user-select: none; }
      html, body { background: #fff; }
      html.dark, html.theme-black { background: #0a0a0a; }
      #root:empty {
        display: flex;
        align-items: center;
        justify-content: center;
        color: #737373;
        font: 15px system-ui, sans-serif;
      }
      html.dark #root:empty, html.theme-black #root:empty { color: #a3a3a3; }
      #root:empty::after { content: "TxtNote yükleniyor…"; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
