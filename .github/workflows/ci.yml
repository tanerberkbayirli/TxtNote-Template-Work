# Unit tests, engine tool tests, type check, production build and Rust tests on every push/PR (HE-TS-04).
# Windows: the PDF font tests need the installed Times New Roman/Arial/Calibri/... programs; elsewhere they skip.
# A skipped test fails the run, so a missing font cannot pass as "green" (HE-TS-03).
# Word parity (parity.mjs, check.mjs --word) and Open XML SDK validation need Microsoft Office and are not run here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            TxtNote/package-lock.json
            TxtNote/frontend/package-lock.json
            engine/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Liberation Serif (SIL OFL; the source-document PDF font tests need it)
        run: |
          curl -sSL -o liberation.tgz https://github.com/liberationfonts/liberation-fonts/files/7261482/liberation-fonts-ttf-2.1.5.tar.gz
          echo "7191c669bf38899f73a2094ed00f7b800553364f90e2637010a69c0e268f25d0  liberation.tgz" | sha256sum -c -
          tar xzf liberation.tgz
          cp liberation-fonts-ttf-2.1.5/LiberationSerif-*.ttf /c/Windows/Fonts/

      - name: Install dependencies
        run: |
          npm ci --prefix engine
          npm ci --prefix TxtNote
          npm ci --prefix TxtNote/frontend
          python -m pip install pymupdf

      - name: Type check
        run: npm run typecheck --prefix TxtNote

      - name: Unit tests (frontend, engine, services)
        run: |
          npm test --prefix TxtNote 2>&1 | tee unit-tests.log
          test "${PIPESTATUS[0]}" -eq 0

      - name: No skipped tests
        # Every line the spec reporter marks "﹣" counts: skipped tests and skipped describe blocks alike, whatever reason
        # text follows (a reason replaces "# SKIP"; a skipped describe is not in the "skipped" total). The only allowed
        # skips are fonts that ship with Microsoft Office, not with Windows, so the runner cannot have them.
        run: |
          grep -E '^\s*﹣ ' unit-tests.log > skips.log || true
          cat skips.log
          grep -vE 'embeds genuine Wingdings [23] \(symbol cmap\)' skips.log > unexpected-skips.log || true
          if [ -s unexpected-skips.log ]; then echo "Unexpected skipped tests:"; cat unexpected-skips.log; exit 1; fi

      - name: Engine tool tests
        run: |
          node --test engine/tools/test_*.mjs
          cd engine/tools && python -m unittest -q test_conformance test_docx2spec

      - name: Production build
        run: npm run build --prefix TxtNote

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust tests
        # tauri::generate_context! embeds TxtNote/frontend/dist, so this runs after the build.
        run: cargo test --lib --manifest-path TxtNote/src-tauri/Cargo.toml
